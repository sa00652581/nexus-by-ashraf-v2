<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Nexus by Ashraf</title>
<link rel="stylesheet" href="style.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:420px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:36px}
.card h1{font-size:24px;margin-bottom:6px}
.muted{color:#5c5c5c;font-size:14px;margin-bottom:24px}
.error{color:#a1392c;font-size:13px;margin-bottom:12px;display:none}
.dash{display:none;width:100%;max-width:900px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{padding:14px 16px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
th{color:var(--teal);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:none}
.empty{color:#5c5c5c;text-align:center;padding:30px}
.logout{margin-top:18px;background:none;border:1px solid var(--line);color:#5c5c5c;width:auto;padding:10px 18px}
</style>
</head>
<body>

<div class="card" id="loginCard">
  <h1>Admin Login</h1>
  <p class="muted">Nexus by Ashraf — leads dashboard</p>
  <div class="error" id="loginError"></div>
  <div class="form-grid">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button class="btn btn-primary" id="loginBtn">Log In</button>
  </div>
</div>

<div class="dash" id="dashboard">
  <h1>Leads</h1>
  <div id="leadsWrap" style="margin:20px 0"><p class="empty">Loading…</p></div>
  <button class="btn logout" id="logoutBtn">Log Out</button>
</div>

<script>
const loginCard = document.getElementById('loginCard');
const dashboard = document.getElementById('dashboard');
const loginError = document.getElementById('loginError');

async function tryLoadLeads() {
  const res = await fetch('/api/admin-leads');
  if (res.status === 401) return false;
  const data = await res.json();
  renderLeads(data.leads || []);
  return true;
}

function renderLeads(leads) {
  const wrap = document.getElementById('leadsWrap');
  if (!leads.length) { wrap.innerHTML = '<p class="empty">No leads yet.</p>'; return; }
  const rows = leads.map(l => `
    <tr><td>${l.name}</td><td>${l.email}</td><td>${l.message || ''}</td><td>${new Date(l.created_at).toLocaleString()}</td></tr>
  `).join('');
  wrap.innerHTML = `<table><thead><tr><th>Name</th><th>Email</th><th>Message</th><th>Received</th></tr></thead><tbody>${rows}</tbody></table>`;
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const password = document.getElementById('password').value;
  loginError.style.display = 'none';
  const res = await fetch('/api/admin-login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });
  const data = await res.json();
  if (data.ok) {
    loginCard.style.display = 'none';
    dashboard.style.display = 'block';
    tryLoadLeads();
  } else {
    loginError.textContent = data.error || 'Login failed.';
    loginError.style.display = 'block';
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  document.cookie = 'admin_session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT';
  dashboard.style.display = 'none';
  loginCard.style.display = 'block';
});

tryLoadLeads().then(ok => {
  if (ok) { loginCard.style.display = 'none'; dashboard.style.display = 'block'; }
});
</script>
</body>
</html>
